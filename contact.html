<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Your Name</title>
  <meta name="description" content="Get in touch with Your Name about internships, projects or collaboration.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main">
      <span class="logo">Your Name</span>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
      <button class="btn btn-outline" id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </nav>
  </header>
  <main>
    <section class="container" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact me</h1>
      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required minlength="3" autocomplete="name" aria-describedby="name-error">
          <p class="error" id="name-error"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-error">
          <p class="error" id="email-error"></p>
        </div>
        <div class="field">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="internship">Internship opportunity</option>
            <option value="project">Project collaboration</option>
            <option value="other">Something else</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required minlength="20" aria-describedby="message-error"></textarea>
          <p class="error" id="message-error"></p>
        </div>
        <fieldset>
          <legend>How did you hear about me?</legend>
          <label><input type="radio" name="source" value="linkedin" checked> LinkedIn</label>
          <label><input type="radio" name="source" value="github"> GitHub</label>
          <label><input type="radio" name="source" value="friend"> A friend</label>
        </fieldset>
        <div class="field">
          <label><input id="consent" name="consent" type="checkbox" required aria-describedby="consent-error"> I agree to be contacted about this message.</label>
          <p class="error" id="consent-error"></p>
        </div>
        <button class="btn" type="submit">Send message</button>
        <p id="form-success" class="success" role="status"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <ul>
        <li><a href="https://github.com/your-username">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/your-username">LinkedIn</a></li>
        <li><a href="mailto:you@example.com">Email</a></li>
      </ul>
      <p>&copy; 2026 Your Name. Built for CS-554.</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
